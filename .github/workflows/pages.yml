name: Deploy viewer
# manual only: Actions minutes are billed (run it from the Actions tab to redeploy the viewer)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/audit-public.py
      - run: npm ci
      - run: npm run build
        env:
          VIEWER_BASE: /3d-model-anything/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/room-viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
